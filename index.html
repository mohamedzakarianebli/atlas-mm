  "Executive Board",
  "Marketing",
  "Human Resources",
  "Project Management",

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

const todayISO = () => new Date().toISOString().slice(0, 10);

const fmtDateDMY = (iso) => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}-${m}-${y}`;
};

const fmtTime = (d) =>
  d ? new Date(d).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";

function emptyMeeting() {
  return {
    id: uid(),
    status: "draft",
    department: "Executive Board",
    purpose: "",
    date: todayISO(),
    startTime: "",
    endTime: "",
    startTimestamp: null,

    location: "",

    presentIds: [],

    justifiedIds: [],
    tasks: [],
    agenda: [""],
    announcements: "",
    discussion: "",
    decisions: "",
    createdAt: Date.now(),
    updatedAt: Date.now(),
  };
}

/* ---------------------------- storage helpers ---------------------------- */

async function loadJSON(key, fallback) {
  try {
    const raw = window.localStorage.getItem("atlas-minutes:" + key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}
async function saveJSON(key, value) {
  try {
    window.localStorage.setItem("atlas-minutes:" + key, JSON.stringify(value));
  } catch (e) {
    console.error("storage save failed", key, e);
  }
}

   and point this function at that proxy instead. -------------------- */

const AI_ENABLED = false;

async function callClaude(prompt, system) {
  if (!AI_ENABLED) {
    throw new Error("AI polish is disabled in this deployment.");
  }
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await res.json();
  const text = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  return text.trim();
}

export default function App() {
  const [page, setPage] = useState("dashboard");
  const [members, setMembers] = useState([]);
  const [meetings, setMeetings] = useState([]);
  const [settings, setSettings] = useState({ logo: null, clubName: "ATLAS Future Leaders", chapter: "TBS Chapter", boardPin: "" });
  const [activeMeetingId, setActiveMeetingId] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [toast, setToast] = useState(null);

  useEffect(() => {
    (async () => {
      const [m, mt, s] = await Promise.all([
        loadJSON("members", []),
        loadJSON("meetings", []),
        loadJSON("settings", { logo: null, clubName: "ATLAS Future Leaders", chapter: "TBS Chapter", boardPin: "" }),
      ]);
      setMembers(m);
      setMeetings(mt);
      setSettings(s);
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { if (loaded) saveJSON("members", members); }, [members, loaded]);
  useEffect(() => { if (loaded) saveJSON("meetings", meetings); }, [meetings, loaded]);
  useEffect(() => { if (loaded) saveJSON("settings", settings); }, [settings, loaded]);

  function showToast(msg) {
    setToast(msg);
    window.clearTimeout(showToast._t);
    showToast._t = window.setTimeout(() => setToast(null), 2400);
  }

  function upsertMeeting(next) {
    next.updatedAt = Date.now();
    setMeetings((prev) => {
      const idx = prev.findIndex((m) => m.id === next.id);
      if (idx === -1) return [next, ...prev];
      const copy = [...prev];
      copy[idx] = next;
      return copy;
    });
  }

  function startNewMeeting() {
    const m = emptyMeeting();
    upsertMeeting(m);
    setActiveMeetingId(m.id);
    setPage("editor");
  }

  const logoSrc = settings.logo || DEFAULT_LOGO;

  if (!loaded) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-stone-50">
        <Loader2 className="w-6 h-6 animate-spin text-emerald-800" />
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-stone-50 text-stone-900 flex">
      <style>{PRINT_CSS}</style>
      <Sidebar page={page} setPage={setPage} logoSrc={logoSrc} clubName={settings.clubName} chapter={settings.chapter} />

      <main className="flex-1 min-w-0">
        {page === "dashboard" && (
          <Dashboard
            meetings={meetings}
            members={members}
            onNew={startNewMeeting}
            onOpen={(id) => { setActiveMeetingId(id); setPage("editor"); }}
          />
        )}

        {page === "editor" && (
          <MeetingEditor
            meeting={meetings.find((m) => m.id === activeMeetingId) || null}
            members={members}
            settings={settings}
            logoSrc={logoSrc}
            onChange={upsertMeeting}
            onBack={() => setPage("dashboard")}
            onFinalize={(m) => { upsertMeeting({ ...m, status: "final" }); showToast("Meeting minutes finalized."); }}
            toast={showToast}
          />
        )}

        {page === "folders" && (
          <FoldersPage meetings={meetings} members={members} settings={settings} logoSrc={logoSrc} />
        )}

        {page === "members" && (
          <MembersGate settings={settings} members={members} setMembers={setMembers} />
        )}

        {page === "settings" && (
          <SettingsGate settings={settings} setSettings={setSettings} defaultLogo={DEFAULT_LOGO} />
        )}
      </main>

      {toast && (
        <div className="fixed bottom-6 right-6 bg-emerald-900 text-stone-50 px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2 no-print">
          <CheckCircle2 className="w-4 h-4" /> {toast}
        </div>
      )}
    </div>
  );
}

/* =========================================================================
   MEETING EDITOR
========================================================================= */

function MeetingEditor({ meeting, members, settings, logoSrc, onChange, onBack, onFinalize, toast }) {
  const [local, setLocal] = useState(meeting || emptyMeeting());
  const [tab, setTab] = useState("form");
  const [aiBusy, setAiBusy] = useState(null);
  const saveTimer = useRef(null);

  useEffect(() => { if (meeting) setLocal(meeting); }, [meeting && meeting.id]);

  useEffect(() => {
    if (!local) return;
    window.clearTimeout(saveTimer.current);
    saveTimer.current = window.setTimeout(() => onChange(local), 700);
    return () => window.clearTimeout(saveTimer.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [local]);

  if (!local) {
    return (
      <div className="p-8">
        <EmptyHint text="Choose a meeting from the dashboard, or start a new one." />
      </div>
    );
  }

  function set(patch) { setLocal((p) => ({ ...p, ...patch })); }

  // Single source of truth: setting a member's status clears the other two lists first.
  function setAttendanceStatus(id, status) {
    const current = local.presentIds.includes(id) ? "present" : local.absentIds.includes(id) ? "absent" : local.justifiedIds.includes(id) ? "justified" : null;
    const present = local.presentIds.filter((x) => x !== id);
    const absent = local.absentIds.filter((x) => x !== id);
    const justified = local.justifiedIds.filter((x) => x !== id);
    if (current === status) {
      // clicking the already-selected status again clears it (back to "unmarked")
      set({ presentIds: present, absentIds: absent, justifiedIds: justified });
      return;
    }
    if (status === "present") present.push(id);
    if (status === "absent") absent.push(id);
    if (status === "justified") justified.push(id);
    set({ presentIds: present, absentIds: absent, justifiedIds: justified });
  }

  const pool = members.filter((m) =>
    local.department === "Executive Board"
      ? EXEC_POSITIONS.includes(m.position)
      : (m.department === local.department || EXEC_POSITIONS.includes(m.position))
  );

  function addTask() { set({ tasks: [...local.tasks, { id: uid(), task: "", assignedTo: "", deadline: "" }] }); }
  function updateTask(id, patch) { set({ tasks: local.tasks.map((t) => (t.id === id ? { ...t, ...patch } : t)) }); }
  function removeTask(id) { set({ tasks: local.tasks.filter((t) => t.id !== id) }); }

  function addAgenda() { set({ agenda: [...local.agenda, ""] }); }
  function updateAgenda(i, val) { const a = [...local.agenda]; a[i] = val; set({ agenda: a }); }
  function removeAgenda(i) { set({ agenda: local.agenda.filter((_, idx) => idx !== i) }); }

  function startMeetingNow() {
    const now = Date.now();
    set({ startTimestamp: now, startTime: fmtTime(now) });
  }
  function endMeetingNow() {
    const now = Date.now();
    set({ endTimestamp: now, endTime: fmtTime(now) });
  }

  async function improveField(field) {
    if (!local[field] || !local[field].trim()) return;
    setAiBusy(field);
    try {
      const out = await callClaude(
        local[field],
        "You proofread and lightly polish meeting-minutes text. Correct grammar and spelling, make the tone clear and professional, and keep it concise. Never invent facts, names, numbers or information that is not already present. Return only the corrected text with no preamble."
      );
      if (out) set({ [field]: out });
    } catch (e) {
      toast("AI request failed. Check your connection and try again.");
    } finally {
      setAiBusy(null);
    }
  }

  const fileName = `${local.department} Meeting Minutes ${fmtDateDMY(local.date)}`.trim();

  // --- PDF / Print -----------------------------------------------------
  // window.print() on the embedded page can be blocked or behave oddly
  // inside a sandboxed preview. Opening the printable HTML in its own
  // browser tab and calling print() there is far more reliable and is
  // exactly what "Save as PDF" needs (every browser's print dialog has
  // a "Save as PDF" destination).
  function doPrint() {
    const html = buildPrintableHTML(local, members, logoSrc, settings);
    const printWin = window.open("", "_blank");
    if (!printWin) {
      toast("Your browser blocked the print window. Please allow pop-ups for this page, then try again.");
      return;
    }
    printWin.document.open();
    printWin.document.write(html);
    printWin.document.close();
    // Give the new tab a beat to lay out (logo is embedded as base64,
    // so there's no network wait, just render time) before printing.
    setTimeout(() => {
      try {
        printWin.focus();
        printWin.print();
      } catch (e) {
        toast("Could not open the print dialog automatically. Use your browser's Print option (Ctrl/Cmd+P) in the new tab, then choose 'Save as PDF'.");
      }
    }, 350);
  }

  function downloadHTML() {
    const html = buildPrintableHTML(local, members, logoSrc, settings);
    const blob = new Blob([html], { type: "text/html" });
    triggerDownload(blob, `${fileName}.html`);
  }
  function downloadWord() {
    const html = buildPrintableHTML(local, members, logoSrc, settings);
    const blob = new Blob(["\ufeff", html], { type: "application/msword" });
    triggerDownload(blob, `${fileName}.doc`);
  }

  return (
    <div className="min-h-screen">
      <div className="no-print sticky top-0 z-10 bg-stone-50/95 backdrop-blur border-b border-stone-200 px-8 py-4 flex items-center justify-between">
        <div className="flex items-center gap-3 min-w-0">
          <button onClick={onBack} className="text-stone-400 hover:text-stone-700"><ChevronRight className="w-5 h-5 rotate-180" /></button>
          <div className="min-w-0">
            <div className="font-serif text-lg text-emerald-950 truncate">{local.purpose || "Untitled meeting"}</div>
            <div className="text-xs text-stone-500">{fileName}.pdf</div>
          </div>
        </div>
        <div className="flex items-center gap-2">
          <div className="flex bg-stone-200 rounded-lg p-1 mr-2">
            <button onClick={() => setTab("form")} className={`px-3 py-1.5 text-xs rounded-md ${tab === "form" ? "bg-white shadow-sm" : "text-stone-500"}`}>Edit</button>
            <button onClick={() => setTab("preview")} className={`px-3 py-1.5 text-xs rounded-md ${tab === "preview" ? "bg-white shadow-sm" : "text-stone-500"}`}>Preview</button>
          </div>
          <button onClick={downloadHTML} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg border border-stone-300 hover:bg-stone-100"><FileDown className="w-3.5 h-3.5" /> HTML</button>
          <button onClick={downloadWord} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg border border-stone-300 hover:bg-stone-100"><FileDown className="w-3.5 h-3.5" /> Word</button>
          <button onClick={doPrint} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg bg-emerald-900 text-white hover:bg-emerald-800"><Download className="w-3.5 h-3.5" /> Save as PDF</button>
          <button onClick={() => onFinalize(local)} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg bg-stone-900 text-white hover:bg-stone-800"><CheckCircle2 className="w-3.5 h-3.5" /> Finalize</button>
        </div>
      </div>

      {tab === "form" ? (
        <div className="max-w-3xl mx-auto p-8 space-y-6 no-print">
          <Section title="Meeting Information">
            <div className="grid grid-cols-2 gap-4">
              <Field label="Department / Template">
                <select value={local.department} onChange={(e) => set({ department: e.target.value })} className="input">
                  {DEPARTMENTS.map((d) => <option key={d}>{d}</option>)}
                </select>
              </Field>
              <Field label="Meeting Purpose">
                <input value={local.purpose} onChange={(e) => set({ purpose: e.target.value })} placeholder="e.g. Weekly Marketing Sync" className="input" />
              </Field>
              <Field label="Date">
                <input type="date" value={local.date} onChange={(e) => set({ date: e.target.value })} className="input" />
              </Field>
              <Field label="Location">
                <div className="flex gap-2">
                  <button type="button" onClick={() => set({ location: "Online" })} className={`flex-1 px-3 py-2 rounded-lg text-sm border ${local.location === "Online" ? "bg-emerald-900 text-white border-emerald-900" : "border-stone-300 text-stone-600 hover:bg-stone-50"}`}>Online</button>
                  <button type="button" onClick={() => set({ location: "In Person" })} className={`flex-1 px-3 py-2 rounded-lg text-sm border ${local.location === "In Person" ? "bg-emerald-900 text-white border-emerald-900" : "border-stone-300 text-stone-600 hover:bg-stone-50"}`}>In Person</button>
                </div>
              </Field>
              <Field label="Start Time">
                <div className="flex gap-2">
                  <input value={local.startTime} onChange={(e) => set({ startTime: e.target.value })} placeholder="--:--" className="input" />
                  <button onClick={startMeetingNow} className="px-3 rounded-lg border border-emerald-700 text-emerald-800 text-xs flex items-center gap-1 shrink-0"><Play className="w-3 h-3" /> Start</button>
                </div>
              </Field>
              <Field label="End Time">
                <div className="flex gap-2">
                  <input value={local.endTime} onChange={(e) => set({ endTime: e.target.value })} placeholder="--:--" className="input" />
                  <button onClick={endMeetingNow} className="px-3 rounded-lg border border-stone-400 text-stone-700 text-xs flex items-center gap-1 shrink-0"><Square className="w-3 h-3" /> End</button>
                </div>
              </Field>
              <Field label="Meeting Facilitator">
                <select value={local.facilitator} onChange={(e) => set({ facilitator: e.target.value })} className="input">
                  <option value="">Select facilitator...</option>
                  {members.map((m) => <option key={m.id} value={m.name}>{m.name}</option>)}
                </select>
              </Field>
            </div>
          </Section>

          <Section title="Attendance" subtitle="Mark every member Present, Absent, or Justified.">
            {pool.length === 0 ? (
              <EmptyHint text="No members found for this department yet. Add them on the Members page." />
            ) : (
              <div className="grid grid-cols-2 gap-2">
                {pool.map((m) => {
                  const present = local.presentIds.includes(m.id);
                  const absent = local.absentIds.includes(m.id);
                  const justified = local.justifiedIds.includes(m.id);
                  return (
                    <div key={m.id} className={`flex items-center justify-between px-3 py-2 rounded-lg border gap-2 ${present ? "border-emerald-300 bg-emerald-50" : absent ? "border-amber-200 bg-amber-50" : justified ? "border-sky-200 bg-sky-50" : "border-stone-200"}`}>
                      <span className="text-sm truncate min-w-0">{m.name}</span>
                      <div className="flex items-center gap-1 shrink-0">
                        <button onClick={() => setAttendanceStatus(m.id, "present")} className={`text-[10px] px-2 py-1 rounded-full ${present ? "bg-emerald-700 text-white" : "bg-stone-100 text-stone-500"}`}>Present</button>
                        <button onClick={() => setAttendanceStatus(m.id, "absent")} className={`text-[10px] px-2 py-1 rounded-full ${absent ? "bg-amber-600 text-white" : "bg-stone-100 text-stone-500"}`}>Absent</button>
                        <button onClick={() => setAttendanceStatus(m.id, "justified")} className={`text-[10px] px-2 py-1 rounded-full ${justified ? "bg-sky-600 text-white" : "bg-stone-100 text-stone-500"}`}>Justified</button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            <div className="flex gap-4 mt-3 text-xs text-stone-500">
              <span>{local.presentIds.length} present</span>
              <span>{local.absentIds.length} absent</span>
              <span>{local.justifiedIds.length} justified</span>
            </div>
          </Section>

          <Section title="Action Items">
            <div className="space-y-2">
              {local.tasks.map((t) => (
                <div key={t.id} className="grid grid-cols-[1fr_1fr_140px_32px] gap-2">
                  <input value={t.task} onChange={(e) => updateTask(t.id, { task: e.target.value })} placeholder="Task" className="input" />
                  <select value={t.assignedTo} onChange={(e) => updateTask(t.id, { assignedTo: e.target.value })} className="input">
                    <option value="">Assign to...</option>
                    {members.map((m) => <option key={m.id} value={m.name}>{m.name}</option>)}
                  </select>
                  <input type="date" value={t.deadline} onChange={(e) => updateTask(t.id, { deadline: e.target.value })} className="input" />
                  <button onClick={() => removeTask(t.id)} className="text-stone-400 hover:text-red-600"><Trash2 className="w-4 h-4" /></button>
                </div>
              ))}
            </div>
            <button onClick={addTask} className="mt-2 text-xs flex items-center gap-1 text-emerald-800 font-medium"><Plus className="w-3.5 h-3.5" /> Add Task</button>
          </Section>

          <Section title="Agenda">
            <div className="space-y-2">
              {local.agenda.map((a, i) => (
                <div key={i} className="flex items-center gap-2">
                  <span className="text-xs text-stone-400 w-4">{i + 1}.</span>
                  <input value={a} onChange={(e) => updateAgenda(i, e.target.value)} placeholder={`Agenda item ${i + 1}`} className="input" />
                  <button onClick={() => removeAgenda(i)} className="text-stone-400 hover:text-red-600"><Trash2 className="w-4 h-4" /></button>
                </div>
              ))}
            </div>
            <button onClick={addAgenda} className="mt-2 text-xs flex items-center gap-1 text-emerald-800 font-medium"><Plus className="w-3.5 h-3.5" /> Add Agenda Item</button>
          </Section>

          <TextSection title="Announcements" value={local.announcements} onChange={(v) => set({ announcements: v })} onImprove={() => improveField("announcements")} busy={aiBusy === "announcements"} />
          <TextSection title="Discussion" value={local.discussion} onChange={(v) => set({ discussion: v })} onImprove={() => improveField("discussion")} busy={aiBusy === "discussion"} rows={6} />
          <TextSection title="Decisions Made" value={local.decisions} onChange={(v) => set({ decisions: v })} onImprove={() => improveField("decisions")} busy={aiBusy === "decisions"} />
        </div>
      ) : (
        <div className="preview-wrap">
          <PrintableSheet meeting={local} members={members} logoSrc={logoSrc} settings={settings} />
        </div>
      )}
    </div>

function esc(s) { return (s || "").toString().replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
function nl2br(s) { return esc(s).replace(/\n/g, "<br/>"); }
function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}

function MembersGate({ settings, members, setMembers }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [unlocked, setUnlocked] = useState(false);

  function unlock() {
    const code = pin.trim();
    if (!code) { setError("Enter the Board PIN."); return; }
    if (settings.boardPin && code === settings.boardPin) {
      setUnlocked(true);
      setError("");
      return;
    }
    setError("Incorrect PIN. The Members page is board-only.");
  }

  if (!unlocked) {
    return (
      <div className="p-8 max-w-sm mx-auto">
        <h1 className="font-serif text-3xl text-emerald-950 mb-1">Members</h1>
        <p className="text-stone-500 text-sm mb-6">This page is restricted to Executive Board members. Enter the Board PIN to continue.</p>
        <div className="bg-white rounded-xl border border-stone-200 p-5">
          <Field label="Board PIN">
            <input
              className="input text-center tracking-[0.3em] text-lg"
              value={pin}
              onChange={(e) => { setPin(e.target.value.replace(/\D/g, "").slice(0, 6)); setError(""); }}
              onKeyDown={(e) => e.key === "Enter" && unlock()}
              placeholder="••••"
              type="password"
              inputMode="numeric"
            />
          </Field>
          {error && <p className="text-xs text-red-600 mt-2 flex items-center gap-1"><AlertCircle className="w-3.5 h-3.5" /> {error}</p>}
          <button onClick={unlock} className="mt-4 w-full flex items-center justify-center gap-1.5 bg-emerald-900 text-white text-sm px-3 py-2.5 rounded-lg">
            <Lock className="w-4 h-4" /> Unlock
          </button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <div className="no-print flex justify-end px-8 pt-6">
        <button onClick={() => { setUnlocked(false); setPin(""); }} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg border border-stone-300 hover:bg-stone-100"><LogOut className="w-3.5 h-3.5" /> Lock</button>
      </div>
      <MembersPage members={members} setMembers={setMembers} />
    </div>
  );
}

function MembersPage({ members, setMembers }) {
  const [draft, setDraft] = useState({ name: "", email: "", department: "Marketing", allocation: "", position: "Member", pin: "" });
  const [q, setQ] = useState("");

  const isEB = EXEC_POSITIONS.includes(draft.position);
  const isPM = draft.department === "Project Management";

  function addMember() {
    if (!draft.name.trim()) return;
    const record = {
      id: uid(),
      name: draft.name,
      email: draft.email,
      position: draft.position,
      department: isEB ? "" : draft.department,
      allocation: isEB || isPM ? "" : draft.allocation,
      pin: isEB ? "" : draft.pin.trim(),
    };
    setMembers((p) => [...p, record]);
    setDraft({ name: "", email: "", department: "Marketing", allocation: "", position: "Member", pin: "" });
  }
  function removeMember(id) { setMembers((p) => p.filter((m) => m.id !== id)); }

  const filtered = members.filter((m) => (m.name + m.email + (m.department || "")).toLowerCase().includes(q.toLowerCase()));

  return (
    <div className="p-8 max-w-4xl mx-auto">
      <h1 className="font-serif text-3xl text-emerald-950 mb-1">Members</h1>
      <p className="text-stone-500 text-sm mb-6">Your club roster — used for one-click attendance selection.</p>

      <div className="bg-white rounded-xl border border-stone-200 p-5 mb-6">
        <h3 className="font-serif text-base text-emerald-950 mb-3">Add a member</h3>
        <div className="grid grid-cols-2 gap-3">
          <input className="input" placeholder="Full name" value={draft.name} onChange={(e) => setDraft({ ...draft, name: e.target.value })} />
          <input className="input" placeholder="Email" value={draft.email} onChange={(e) => setDraft({ ...draft, email: e.target.value })} />
          <select className="input col-span-2" value={draft.position} onChange={(e) => setDraft({ ...draft, position: e.target.value })}>
            <optgroup label="Executive Board">
              {EXEC_POSITIONS.map((p) => <option key={p}>{p}</option>)}
            </optgroup>
            <optgroup label="Department Member">
              <option>Member</option>
            </optgroup>
          </select>

          {!isEB && (
            <select className="input" value={draft.department} onChange={(e) => setDraft({ ...draft, department: e.target.value })}>
              {DEPARTMENTS.filter((d) => d !== "Executive Board").map((d) => <option key={d}>{d}</option>)}
            </select>
          )}
          {!isEB && !isPM && (
            <input className="input" placeholder="Allocation department (optional)" value={draft.allocation} onChange={(e) => setDraft({ ...draft, allocation: e.target.value })} />
          )}
          {!isEB && (
            <input
              className="input"
              placeholder="4-digit PIN (for department folder access)"
              value={draft.pin}
              onChange={(e) => setDraft({ ...draft, pin: e.target.value.replace(/\D/g, "").slice(0, 4) })}
              maxLength={4}
              inputMode="numeric"
            />
          )}
        </div>
        {isEB && <p className="text-xs text-stone-400 mt-2">Executive Board members belong to the board itself, so no department, allocation department, or personal PIN is needed — they use the shared Board PIN set in Settings.</p>}
        {!isEB && isPM && <p className="text-xs text-stone-400 mt-2">Project Management members only have their PM department — no allocation department.</p>}
        <button onClick={addMember} className="mt-3 flex items-center gap-1.5 bg-emerald-900 text-white text-sm px-3 py-2 rounded-lg"><Plus className="w-4 h-4" /> Add Member</button>
      </div>

      <div className="flex items-center gap-2 mb-3">
        <Search className="w-4 h-4 text-stone-400" />
        <input className="input" placeholder="Search members..." value={q} onChange={(e) => setQ(e.target.value)} />
      </div>

      <div className="bg-white rounded-xl border border-stone-200 divide-y divide-stone-100">
        {filtered.length === 0 && <EmptyHint text="No members yet." />}
        {filtered.map((m) => (
          <div key={m.id} className="flex items-center justify-between px-4 py-3">
            <div>
              <div className="text-sm font-medium">{m.name}</div>
              <div className="text-xs text-stone-500">{m.position}{m.department ? ` · ${m.department}` : ""}{m.allocation ? ` (${m.allocation})` : ""} &middot; {m.email}{m.pin ? ` · PIN ${m.pin}` : ""}</div>

            <button onClick={() => removeMember(m.id)} className="text-stone-400 hover:text-red-600"><Trash2 className="w-4 h-4" /></button>
          </div>
        ))}
      </div>
    </div>
  );
}

/* =========================================================================
   FOLDERS (PIN-gated access to meeting minutes)
   - A regular member's personal PIN opens only their own department's
     folder plus the Club folder (open to everyone).
   - The shared Board PIN (set in Settings) opens every folder, including
     Executive Board.
   Access resets to locked whenever this page is left, since the unlocked
   state lives only in this component's local state.
========================================================================= */

function FoldersPage({ meetings, members, settings, logoSrc }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [access, setAccess] = useState(null); // { role: "board" } | { role: "member", department, memberName }
  const [openFolder, setOpenFolder] = useState(null);
  const [viewingMeeting, setViewingMeeting] = useState(null);

  function unlock() {
    const code = pin.trim();
    if (!code) { setError("Enter a PIN."); return; }
    if (settings.boardPin && code === settings.boardPin) {
      setAccess({ role: "board" });
      setError("");
      return;
    }
    const match = members.find((m) => m.pin && m.pin === code);
    if (match) {
      setAccess({ role: "member", department: match.department, memberName: match.name });
      setError("");
      return;
    }
    setError("Incorrect PIN. Check with your department VP or the board.");
  }

  function lock() {
    setAccess(null);
    setPin("");
    setError("");
    setOpenFolder(null);
    setViewingMeeting(null);
  }

  if (!access) {
    return (
      <div className="p-8 max-w-sm mx-auto">
        <h1 className="font-serif text-3xl text-emerald-950 mb-1">Folders</h1>
        <p className="text-stone-500 text-sm mb-6">Enter your personal PIN, or the Board PIN, to view meeting minutes.</p>
        <div className="bg-white rounded-xl border border-stone-200 p-5">
          <Field label="PIN">
            <input
              className="input text-center tracking-[0.3em] text-lg"
              value={pin}
              onChange={(e) => { setPin(e.target.value.replace(/\D/g, "").slice(0, 6)); setError(""); }}
              onKeyDown={(e) => e.key === "Enter" && unlock()}
              placeholder="••••"
              type="password"
              inputMode="numeric"
            />
          </Field>
          {error && <p className="text-xs text-red-600 mt-2 flex items-center gap-1"><AlertCircle className="w-3.5 h-3.5" /> {error}</p>}
          <button onClick={unlock} className="mt-4 w-full flex items-center justify-center gap-1.5 bg-emerald-900 text-white text-sm px-3 py-2.5 rounded-lg">
            <Lock className="w-4 h-4" /> Unlock
          </button>
        </div>
      </div>
    );
  }

  const accessibleDepartments =
    access.role === "board"
      ? DEPARTMENTS
      : [access.department, "Club"].filter((d, i, arr) => d && arr.indexOf(d) === i);

  if (viewingMeeting) {
    return (
      <div className="min-h-screen">
        <div className="no-print sticky top-0 z-10 bg-stone-50/95 backdrop-blur border-b border-stone-200 px-8 py-4 flex items-center justify-between">
          <button onClick={() => setViewingMeeting(null)} className="flex items-center gap-1.5 text-sm text-stone-600 hover:text-stone-900">
            <ChevronRight className="w-4 h-4 rotate-180" /> Back to folder
          </button>
          <button onClick={lock} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg border border-stone-300 hover:bg-stone-100"><LogOut className="w-3.5 h-3.5" /> Lock</button>
        </div>
        <div className="preview-wrap">
          <PrintableSheet meeting={viewingMeeting} members={members} logoSrc={logoSrc} settings={settings} />
        </div>
      </div>
    );
  }

  if (openFolder) {
    const folderMeetings = meetings
      .filter((m) => m.department === openFolder)
      .sort((a, b) => b.updatedAt - a.updatedAt);
    return (
      <div className="p-8 max-w-2xl mx-auto">
        <div className="flex items-center justify-between mb-6">
          <div>
            <button onClick={() => setOpenFolder(null)} className="text-xs text-stone-500 hover:text-stone-800 flex items-center gap-1 mb-2"><ChevronRight className="w-3.5 h-3.5 rotate-180" /> All folders</button>
            <h1 className="font-serif text-2xl text-emerald-950">{openFolder} Minutes</h1>
          </div>
          <button onClick={lock} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg border border-stone-300 hover:bg-stone-100"><LogOut className="w-3.5 h-3.5" /> Lock</button>
        </div>
        <div className="bg-white rounded-xl border border-stone-200 divide-y divide-stone-100">
          {folderMeetings.length === 0 && <EmptyHint text="No meeting minutes in this folder yet." />}
          {folderMeetings.map((m) => (
            <button key={m.id} onClick={() => setViewingMeeting(m)} className="w-full text-left flex items-center justify-between px-4 py-3 hover:bg-stone-50">
              <div className="min-w-0">
                <div className="text-sm font-medium truncate">{m.purpose || "Untitled meeting"}</div>
                <div className="text-xs text-stone-500">{fmtDateDMY(m.date)}</div>
              </div>
              <span className={`text-[10px] uppercase tracking-wide px-2 py-1 rounded-full shrink-0 ml-2 ${m.status === "final" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"}`}>
                {m.status}
              </span>
            </button>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="p-8 max-w-2xl mx-auto">
      <div className="flex items-center justify-between mb-1">
        <h1 className="font-serif text-3xl text-emerald-950">Folders</h1>
        <button onClick={lock} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg border border-stone-300 hover:bg-stone-100"><LogOut className="w-3.5 h-3.5" /> Lock</button>
      </div>
      <p className="text-stone-500 text-sm mb-6">
        {access.role === "board" ? "Board access — every folder is open to you." : `Signed in as ${access.memberName}.`}
      </p>
      <div className="grid grid-cols-2 gap-3">
        {accessibleDepartments.map((d) => {
          const count = meetings.filter((m) => m.department === d).length;
          return (
            <button key={d} onClick={() => setOpenFolder(d)} className="text-left bg-white rounded-xl border border-stone-200 p-4 hover:border-emerald-300">
              <div className="flex items-center gap-2 text-emerald-900 mb-1"><Folder className="w-4 h-4" /> <span className="font-serif text-base">{d}</span></div>
              <div className="text-xs text-stone-500">{count} meeting{count === 1 ? "" : "s"}</div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function SettingsGate({ settings, setSettings, defaultLogo }) {
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");
  const [unlocked, setUnlocked] = useState(false);

  // First-time setup: if no Board PIN has ever been set, let the club get
  // in once to create one. After that, this page always requires it.
  const bootstrapping = !settings.boardPin;

  function unlock() {
    const code = pin.trim();
    if (!code) { setError("Enter the Board PIN."); return; }
    if (settings.boardPin && code === settings.boardPin) {
      setUnlocked(true);
      setError("");
      return;
    }
    setError("Incorrect PIN. Settings is board-only.");
  }

  if (!bootstrapping && !unlocked) {
    return (
      <div className="p-8 max-w-sm mx-auto">
        <h1 className="font-serif text-3xl text-emerald-950 mb-1">Settings</h1>
        <p className="text-stone-500 text-sm mb-6">This page is restricted to Executive Board members. Enter the Board PIN to continue.</p>
        <div className="bg-white rounded-xl border border-stone-200 p-5">
          <Field label="Board PIN">
            <input
              className="input text-center tracking-[0.3em] text-lg"
              value={pin}
              onChange={(e) => { setPin(e.target.value.replace(/\D/g, "").slice(0, 6)); setError(""); }}
              onKeyDown={(e) => e.key === "Enter" && unlock()}
              placeholder="••••"
              type="password"
              inputMode="numeric"
            />
          </Field>
          {error && <p className="text-xs text-red-600 mt-2 flex items-center gap-1"><AlertCircle className="w-3.5 h-3.5" /> {error}</p>}
          <button onClick={unlock} className="mt-4 w-full flex items-center justify-center gap-1.5 bg-emerald-900 text-white text-sm px-3 py-2.5 rounded-lg">
            <Lock className="w-4 h-4" /> Unlock
          </button>
        </div>
      </div>
    );
  }

  return (
    <div>
      {!bootstrapping && (
        <div className="no-print flex justify-end px-8 pt-6">
          <button onClick={() => { setUnlocked(false); setPin(""); }} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg border border-stone-300 hover:bg-stone-100"><LogOut className="w-3.5 h-3.5" /> Lock</button>
        </div>
      )}
      <SettingsPage settings={settings} setSettings={setSettings} defaultLogo={defaultLogo} />
    </div>
  );
}

/* =========================================================================
   SETTINGS PAGE
========================================================================= */

function SettingsPage({ settings, setSettings, defaultLogo }) {
  const fileRef = useRef(null);
  function onLogoUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setSettings((s) => ({ ...s, logo: reader.result }));
    reader.readAsDataURL(file);
  }
  return (
    <div className="p-8 max-w-2xl mx-auto">
      <h1 className="font-serif text-3xl text-emerald-950 mb-1">Settings</h1>
      <p className="text-stone-500 text-sm mb-6">Branding shown on every generated Meeting Minutes PDF.</p>

      <div className="bg-white rounded-xl border border-stone-200 p-5 mb-5">
        <h3 className="font-serif text-base text-emerald-950 mb-3">Club Branding</h3>
        <div className="flex items-center gap-4 mb-4">
          <img src={settings.logo || defaultLogo} className="w-16 h-16 rounded-full object-contain bg-stone-50 border border-stone-200" />
          <div>
            <button onClick={() => fileRef.current.click()} className="flex items-center gap-1.5 text-xs px-3 py-2 rounded-lg border border-stone-300 hover:bg-stone-100"><Upload className="w-3.5 h-3.5" /> Upload Club Logo</button>
            <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={onLogoUpload} />
            {settings.logo && <button onClick={() => setSettings((s) => ({ ...s, logo: null }))} className="ml-2 text-xs text-stone-400 hover:text-red-600">Reset to default</button>}
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Club Name">
            <input className="input" value={settings.clubName} onChange={(e) => setSettings((s) => ({ ...s, clubName: e.target.value }))} />
          </Field>
          <Field label="Chapter">
            <input className="input" value={settings.chapter} onChange={(e) => setSettings((s) => ({ ...s, chapter: e.target.value }))} />
          </Field>
        </div>
      </div>

      <div className="bg-white rounded-xl border border-stone-200 p-5 mb-5">
        <h3 className="font-serif text-base text-emerald-950 mb-3">Access Control</h3>
        <Field label="Board PIN (opens every department folder + Executive Board minutes)">
          <input
            className="input"
            value={settings.boardPin || ""}
            onChange={(e) => setSettings((s) => ({ ...s, boardPin: e.target.value.replace(/\D/g, "").slice(0, 6) }))}
            placeholder="e.g. 8842"
            inputMode="numeric"
            type="password"
          />
        </Field>
        <p className="text-xs text-stone-400 mt-2">Share this PIN only with the 8 board positions — President, Vice President, Treasurer, General Secretary, and the 4 department VPs. Regular department members use their own personal PIN, set for them on the Members page, which only opens their department's folder plus the Club folder.</p>
      </div>

      <div className="bg-white rounded-xl border border-stone-200 p-5 text-sm text-stone-600 leading-relaxed">
        <h3 className="font-serif text-base text-emerald-950 mb-2">How this app works</h3>
        <p className="mb-2">Everything you enter is saved automatically in this browser — no server, no database setup. Click <strong>Save as PDF</strong> to open the finished minutes in a new tab and print them; choose "Save as PDF" as the destination in the print dialog. <strong>HTML</strong> and <strong>Word</strong> exports download instantly.</p>
        <p>If the PDF tab doesn't open, your browser likely blocked the pop-up — allow pop-ups for this page and click the button again.</p>
      </div>
    </div>
  );
}

/* ---------------------------- mount ---------------------------- */
const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);

</script>
</body>
</html>
