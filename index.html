const DEPARTMENTS = ["Executive Board", "Marketing", "Human Resources", "Project Management", "External Relations", "Club"];
const EXEC_POSITIONS = ["President", "Vice President", "Treasurer", "General Secretary", "Marketing VP", "Project Management VP", "External Relationships VP", "Human Resources VP"];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDateDMY = iso => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}-${m}-${y}`;
};
const fmtTime = d => d ? new Date(d).toLocaleTimeString([], {
  hour: "2-digit",
  minute: "2-digit"
}) : "";
function emptyMeeting() {
  return {
    id: uid(),
    status: "draft",
    department: "Executive Board",
    purpose: "",
    date: todayISO(),
    startTime: "",
    endTime: "",
    startTimestamp: null,
    endTimestamp: null,
    location: "",
    facilitator: "",
    presentIds: [],
    absentIds: [],
    justifiedIds: [],
    tasks: [],
    agenda: [""],
    announcements: "",
    discussion: "",
    decisions: "",
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

/* ---------------------------- storage helpers ---------------------------- */

async function loadJSON(key, fallback) {
  try {
    const raw = window.localStorage.getItem("atlas-minutes:" + key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
